name: Test Python health check

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest -v
      - name: Build Docker image
        run: docker build -t cicd-learning:ci .
